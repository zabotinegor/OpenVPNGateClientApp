# Azure DevOps fallback release pipeline for the Android client: beta from dev, stable from main, and explicit v* tags.
# Connected directly to the GitHub repository (no Azure Repos copy, no GitHub-hosted router job). Thin adapter: all
# release logic is in scripts/ci/android_ci.py and .ci/pipeline-contract.json; scripts/ci/check_pipeline_parity.py fails
# when this file drifts from the contract. One pipeline serves all three release types; android_ci.py resolve-mode
# selects the type from the triggering ref.
#
# The definition is enabled only while CI_PROVIDER=azure (scripts/ci/pipeline-mode.ps1). The guard step waits for a
# running provider switch and re-reads CI_PROVIDER live before doing any work.
#
# Serialization: lockBehavior sequential plus an Exclusive Lock check on the environment android-release-build-number
# make releases run one at a time, so build numbers and tags cannot collide. Queued runs wait; none is cancelled.
#
# Trust: this pipeline never runs for pull requests (pr: none). It has its OWN identity: only the service connection
# openvpn-android-azure-release (authorized for this pipeline only, never for azure-pipelines.yml) and only the secrets in
# the azure-release consumer of the contract. Nothing is copied into Azure pipeline variables.

trigger:
  batch: true
  branches:
    include:
      - dev
      - main
  tags:
    include:
      - 'v*'
    exclude:
      - '*-auto*'

pr: none

lockBehavior: sequential

parameters:
  - name: replay
    displayName: Provider hand-off replay (set by scripts/ci/pipeline-mode.ps1)
    type: boolean
    default: false

pool:
  vmImage: ubuntu-latest

variables:
  # Bootstrap constants; they must equal keyVault.bootstrap in .ci/pipeline-contract.json (parity-checked).
  AZURE_RELEASE_SERVICE_CONNECTION: openvpn-android-azure-release
  AZURE_KEY_VAULT_NAME: openvpngateclient-prd-kv
  JDK_VERSION: '17'

jobs:
  - deployment: release
    displayName: Build and Release
    environment: android-release-build-number
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self
              fetchDepth: 0
              fetchTags: true
              submodules: false
              persistCredentials: false

            - task: AzureCLI@2
              displayName: Load release secrets from Key Vault
              inputs:
                azureSubscription: $(AZURE_RELEASE_SERVICE_CONNECTION)
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: python3 scripts/ci/load_vault_secrets.py --provider azure --consumer azure-release --vault "$AZURE_KEY_VAULT_NAME"
              env:
                AZURE_KEY_VAULT_NAME: $(AZURE_KEY_VAULT_NAME)

            - bash: python3 scripts/ci/android_ci.py guard --provider azure
              name: guard
              displayName: Guard - check active CI provider
              env:
                GH_PAT: $(GH_PAT)
                CI_REPOSITORY: $(Build.Repository.Name)

            - bash: python3 scripts/ci/android_ci.py resolve-mode
              name: mode
              displayName: Resolve release type from the triggering ref
              condition: and(succeeded(), eq(variables['guard.active'], 'true'))

            - bash: >-
                python3 scripts/ci/android_ci.py detect-changes --event auto
                --replay "${{ parameters.replay }}" --mode "$(mode.mode)"
                --before auto --after "$(Build.SourceVersion)" --pinned-sha "$(Build.SourceVersion)"
              name: detect
              displayName: Detect code changes (and refuse a stale replay)
              condition: and(succeeded(), eq(variables['guard.active'], 'true'), eq(variables['mode.run'], 'true'))
              env:
                GH_PAT: $(GH_PAT)
                CI_REPOSITORY: $(Build.Repository.Name)
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

            - bash: bash scripts/ci/checkout-submodules.sh
              displayName: Checkout private submodules
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                GH_PAT: $(GH_PAT)

            - bash: python3 scripts/ci/load_repo_variables.py --pipeline release-common --repository "$(Build.Repository.Name)"
              displayName: Load repository variables from GitHub
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                GH_PAT: $(GH_PAT)

            - task: JavaToolInstaller@0
              displayName: Set up JDK 17
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              inputs:
                versionSpec: $(JDK_VERSION)
                jdkArchitectureOption: x64
                jdkSourceOption: PreInstalled

            - bash: python3 scripts/ci/android_ci.py install-swig
              displayName: Install swig
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))

            - bash: python3 scripts/ci/android_ci.py version --mode "$(mode.mode)" --ref-name "$(Build.SourceBranch)"
              displayName: Generate version
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                CI_REPOSITORY: $(Build.Repository.Name)

            - bash: python3 scripts/ci/android_ci.py write-signing
              displayName: Write signing configuration
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                SIGNING_KEY_BASE64: $(SIGNING_KEY_BASE64)
                KEY_ALIAS: $(KEY_ALIAS)
                KEY_PASSWORD: $(KEY_PASSWORD)
                STORE_PASSWORD: $(STORE_PASSWORD)

            - bash: python3 scripts/ci/android_ci.py gradle stage-release
              displayName: Build signed release artifacts
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                PRIMARY_SERVERS_URL: $(repo.PRIMARY_SERVERS_URL)
                FALLBACK_SERVERS_URL: $(repo.FALLBACK_SERVERS_URL)

            - bash: python3 scripts/ci/android_ci.py stage-artifacts
              displayName: Stage artifacts
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))

            - bash: python3 scripts/ci/android_ci.py create-tag --sha "$(Build.SourceVersion)"
              displayName: Create Git tag
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                GH_PAT: $(GH_PAT)
                CI_REPOSITORY: $(Build.Repository.Name)

            - bash: python3 scripts/ci/android_ci.py publish-release
              displayName: Publish GitHub release
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                GH_PAT: $(GH_PAT)
                CI_REPOSITORY: $(Build.Repository.Name)

            - bash: python3 scripts/ci/android_ci.py versions-api
              displayName: Publish version and release notes
              condition: and(succeeded(), eq(variables['detect.has_code_changes'], 'true'))
              env:
                VERSIONS_API_KEY: $(VERSIONS_API_KEY)
                VERSIONS_API_BASE_URL: $(repo.VERSIONS_API_BASE_URL)
                CI_REPOSITORY: $(Build.Repository.Name)
