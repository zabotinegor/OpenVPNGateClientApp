name: Release from Tag

# Thin GitHub adapter. Release logic lives in scripts/ci/android_ci.py and .ci/pipeline-contract.json;
# scripts/ci/check_pipeline_parity.py fails when this file drifts from that contract.
# Runs only while CI_PROVIDER is not 'azure' (scripts/ci/pipeline-mode.ps1): the job-level condition is a coarse
# zero-runner admission hint, and the guard step waits for a running provider switch and re-reads CI_PROVIDER live.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-build-number
  cancel-in-progress: false

jobs:
  guard:
    name: Check active provider
    # Tags created by the branch release flows contain '-auto' and are ignored here.
    if: "vars.CI_PROVIDER != 'azure' && !contains(github.ref_name, '-auto')"
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.guard.outputs.active }}
    env:
      GH_PAT: ${{ secrets.GH_PAT }}
      CI_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GH_PAT }}

      - name: Check active provider
        id: guard
        run: python3 scripts/ci/android_ci.py guard --provider github --snapshot "${{ vars.CI_PROVIDER }}"

  build:
    name: Build and Release
    needs: guard
    if: needs.guard.outputs.active == 'true'
    runs-on: ubuntu-latest
    env:
      PRIMARY_SERVERS_URL: ${{ vars.PRIMARY_SERVERS_URL }}
      FALLBACK_SERVERS_URL: ${{ vars.FALLBACK_SERVERS_URL }}
      VERSIONS_API_BASE_URL: ${{ vars.VERSIONS_API_BASE_URL }}
      CI_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install swig
        run: python3 scripts/ci/android_ci.py install-swig

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version from tag
        run: python3 scripts/ci/android_ci.py version --mode tag --ref-name "$GITHUB_REF_NAME"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: Write signing configuration
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: python3 scripts/ci/android_ci.py write-signing

      - name: Build signed release artifacts
        run: python3 scripts/ci/android_ci.py gradle stage-release

      - name: Stage artifacts
        run: python3 scripts/ci/android_ci.py stage-artifacts

      - name: Create build marker tag
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/ci/android_ci.py create-tag

      - name: Publish GitHub release
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/ci/android_ci.py publish-release

      - name: Publish version and release notes
        env:
          VERSIONS_API_KEY: ${{ secrets.VERSIONS_API_KEY }}
        run: python3 scripts/ci/android_ci.py versions-api
