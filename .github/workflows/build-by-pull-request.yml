name: PR Build Check

# Thin GitHub adapter. Build logic lives in scripts/ci/android_ci.py and .ci/pipeline-contract.json;
# scripts/ci/check_pipeline_parity.py fails when this file drifts from that contract.
# Runs only while CI_PROVIDER is not 'azure' (scripts/ci/pipeline-mode.ps1); a skipped job allocates no runner.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Least privilege: no workflow-level grant. The build job runs pull-request-controlled code and gets no statuses scope;
# only the checkout-free gate job may write commit statuses.
permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APKs
    if: vars.CI_PROVIDER != 'azure'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    env:
      PRIMARY_SERVERS_URL: ${{ vars.PRIMARY_SERVERS_URL }}
      FALLBACK_SERVERS_URL: ${{ vars.FALLBACK_SERVERS_URL }}
      CI_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Dedicated read-only token (Contents read on this repo and the private submodules). The release PAT GH_PAT
          # is never used here, and the credential is not left in .git/config for the PR-controlled steps below.
          token: ${{ secrets.PR_CI_READ_PAT }}
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set build metadata
        id: build_meta
        run: python3 scripts/ci/android_ci.py pr-metadata --sha "$(git rev-parse HEAD)"

      - name: Pipeline parity check and CI script tests
        run: bash scripts/ci/run-ci-tests.sh

      - name: Install swig
        run: python3 scripts/ci/android_ci.py install-swig

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: python3 scripts/ci/android_ci.py install-android-sdk

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          # PR runs keep the build cache read-only to limit storage growth.
          cache-read-only: true

      - name: Run Unit Tests (app)
        run: python3 scripts/ci/android_ci.py gradle unit-tests

      - name: Upload Unit Test Reports
        # Only upload on failure to reduce storage; keep 5 days for PR debugging.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            src/**/build/reports/tests/testDebugUnitTest/**
            src/**/build/test-results/testDebugUnitTest/**
          retention-days: 5

      - name: Build Debug APKs (mobile + tv)
        run: python3 scripts/ci/android_ci.py gradle debug-apks

      - name: Build Release APKs (unsigned sanity check)
        run: python3 scripts/ci/android_ci.py gradle release-sanity

      - name: Rename APKs with commit SHA
        run: python3 scripts/ci/android_ci.py rename-apks --sha "$(git rev-parse HEAD)"

      - name: Upload Debug APK (mobile)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-mobile-debug_${{ steps.build_meta.outputs.short_sha }}
          path: src/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Debug APK (tv)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-tv-debug_${{ steps.build_meta.outputs.short_sha }}
          path: src/tv/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 3

      - name: Comment PR with APK links
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request context. Skipping comment.');
              return;
            }
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const sha = pr.head?.sha || context.sha;
            const shortSha = sha.substring(0, 7);

            const commitResp = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: sha,
            });
            const commitTitle =
              commitResp?.data?.commit?.message?.split('\n')[0] || 'unknown';

            const artifactsResp = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });
            const artifacts = artifactsResp.data.artifacts || [];
            const byName = (name) => artifacts.find((a) => a.name === name);
            const mobile = byName(`apk-mobile-debug_${shortSha}`);
            const tv = byName(`apk-tv-debug_${shortSha}`);

            const toLink = (artifact) =>
              artifact
                ? `[${artifact.name}](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifact.id})`
                : '_not found_';

            const body = [
              `Build artifacts for commit \`${sha}\` (${commitTitle}):`,
              `- Mobile APK: ${toLink(mobile)}`,
              `- TV APK: ${toLink(tv)}`,
              `Run: https://github.com/${owner}/${repo}/actions/runs/${runId}`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });

  # Posts the "CI Gate" commit status from the job result (same context the Azure pipeline posts). A skipped GitHub
  # job counts as passing in branch protection, so the status (not the job) is what a ruleset should require: it is
  # only posted by a provider that actually ran CI. It uses github-script and no checkout so that no pull-request
  # controlled code ever runs with a status-write token. Same-repository PRs only (fork tokens cannot write statuses).
  gate:
    name: CI Gate
    needs: build
    if: >-
      always() && vars.CI_PROVIDER != 'azure' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report CI Gate status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const result = process.env.BUILD_RESULT;
            const state = result === 'success' ? 'success' : result === 'cancelled' ? 'error' : result === 'skipped' ? null : 'failure';
            if (!state) {
              core.info('Build was skipped; not posting a CI Gate status.');
              return;
            }
            const descriptions = { success: 'CI passed', failure: 'CI failed', error: 'CI cancelled' };
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: 'CI Gate',
              description: `GitHub ${descriptions[state]}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
