name: Android PR CI

# This is the sole pull_request entrypoint. The existing APK build is reused in
# the SAME run so a passing debug build is never mistaken for the required
# commit status and no second expensive Gradle run is started.
on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android build and unit tests
    # The reusable job retains existing mobile/TV unit, debug and unsigned
    # release checks and the short-lived PR APK artifacts.
    uses: ./.github/workflows/build-by-pull-request.yml
    permissions:
      actions: read
      contents: read
      pull-requests: write
    secrets: inherit

  gate:
    name: Publish CI Gate status
    needs: build
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report exact PR head build result
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const result = process.env.BUILD_RESULT;
            const ok = result === 'success';
            const sha = context.payload.pull_request.head.sha;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state: ok ? 'success' : 'failure',
              context: 'CI Gate',
              description: ok
                ? 'Android unit tests and mobile/TV debug/release builds passed'
                : `Android PR build did not pass (result: ${result})`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
