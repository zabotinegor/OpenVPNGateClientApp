name: Integration CI

# Trusted dispatch-only revalidation of the exact merge of a PR head onto the
# live dev branch tip. The review host consumes "Integration CI Gate" only
# after the merge tree is proved equal to GitHub's merge commit tree.
#
# This workflow must be installed on the trusted dispatch ref (dev), and
# GitHub requires a workflow_dispatch workflow to exist on the default branch
# before manual/API dispatch will work. A feature PR cannot bootstrap its own
# integration gate until that installation prerequisite is met.
#
# The private media submodule is fetched from TRUSTED dev with a checkout-only
# credential before any PR code is merged. No PAT, signing key, write token or
# cached credential is passed into Gradle or arbitrary PR code. publish-evidence
# runs only dev's trusted integration script; it never checks out the PR.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      head:
        description: PR head commit SHA (40 lowercase hexadecimal characters)
        required: true
        type: string
      base:
        description: Live dev tip SHA (40 lowercase hexadecimal characters)
        required: true
        type: string

run-name: Integration CI pr=${{ inputs.pr }} head=${{ inputs.head }} base=${{ inputs.base }}

permissions: {}

concurrency:
  group: android-integration-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  integration-build:
    name: Test exact dev plus PR merge
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    outputs:
      tree: ${{ steps.prepare.outputs.tree }}
    env:
      ORG_GRADLE_PROJECT_PRIMARY_SERVERS_URL: ${{ vars.PRIMARY_SERVERS_URL }}
      ORG_GRADLE_PROJECT_FALLBACK_SERVERS_URL: ${{ vars.FALLBACK_SERVERS_URL }}
      GRADLE_OPTS: -Xmx5120m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout trusted dev and private submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Validate dispatch and prepare exact merge tree
        id: prepare
        shell: bash
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          BASE_SHA: ${{ inputs.base }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/integration_ci.py prepare

      # After the trusted preparation above, never pass a credential to the
      # merged pull request code. If an updated submodule needs private access,
      # the step fails closed rather than exposing the checkout PAT.
      - name: Verify merged submodule pointers
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --recursive
          if git submodule status --recursive | grep -E '^[+-U]'; then
            echo 'Integration submodules are not at the merged gitlink SHAs' >&2
            exit 1
          fi

      - name: Install SWIG
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;29.0.14206865"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || test "${PIPESTATUS[0]}" -eq 141

      - name: Set up Gradle without caching PR code
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Android unit tests, mobile and TV debug/release builds
        shell: bash
        working-directory: src
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTestApp --stacktrace
          ./gradlew --no-daemon --max-workers=2 assembleDebugApp --stacktrace
          ./gradlew --no-daemon --max-workers=2 assembleReleaseApp --stacktrace
          ./gradlew --no-daemon --max-workers=2 bundleReleaseApp --stacktrace

  publish-evidence:
    name: Publish Integration CI Gate
    needs: integration-build
    if: ${{ success() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: Checkout trusted verification script only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          submodules: false
          fetch-depth: 1
          persist-credentials: false

      - name: Recheck live base, head and exact merge tree before status
        shell: bash
        env:
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head }}
          BASE_SHA: ${{ inputs.base }}
          TREE: ${{ needs.integration-build.outputs.tree }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci/integration_ci.py publish
