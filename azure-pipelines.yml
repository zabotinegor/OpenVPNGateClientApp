# Azure DevOps fallback PR CI for the Android client. Connected directly to the GitHub repository (no Azure Repos copy).
# Thin adapter: all build logic is in scripts/ci/android_ci.py and .ci/pipeline-contract.json;
# scripts/ci/check_pipeline_parity.py fails when this file drifts from the contract.
#
# The pipeline definition is enabled only while CI_PROVIDER=azure (scripts/ci/pipeline-mode.ps1), so no hosted agent is
# allocated in GitHub mode; the guard step re-checks the live provider as a second line of defence.
#
# Least privilege, two jobs, two identities:
#   build - builds and runs pull-request-controlled code. Service connection openvpn-android-azure-pr-ci and ONLY the
#           secret github-android-pr-ci-pat (GH_PAT: Metadata/Contents read + Actions Variables read; NO commit statuses,
#           no write scope of any kind). It is never passed to the Gradle steps. The vault loader runs from a copy of the
#           target branch (first parent of the PR merge commit), not from the PR tree.
#   gate  - posts the CI Gate commit status. Service connection openvpn-android-azure-pr-gate and ONLY the secret
#           github-android-pr-gate-pat (GH_PAT here: Commit statuses write, nothing else). It runs the loader and
#           android_ci.py from the target-branch copy, so pull-request-controlled scripts never see the statuses token
#           and a PR cannot forge its own CI Gate by editing scripts/ci.
# Neither identity holds a signing key, release credential or provider-switch credential; those are loaded by
# azure-release.yml (never runs for PRs) and by pipeline-mode.ps1.

trigger: none

pr:
  autoCancel: true
  branches:
    include:
      - '*'

pool:
  vmImage: ubuntu-latest

variables:
  # Bootstrap constants; they must equal keyVault.bootstrap in .ci/pipeline-contract.json (parity-checked).
  AZURE_PR_CI_SERVICE_CONNECTION: openvpn-android-azure-pr-ci
  AZURE_PR_GATE_SERVICE_CONNECTION: openvpn-android-azure-pr-gate
  AZURE_KEY_VAULT_NAME: openvpngateclient-prd-kv
  JDK_VERSION: '17'

jobs:
  - job: build
    displayName: Build and test
    steps:
      - checkout: self
        fetchDepth: 0
        fetchTags: false
        submodules: false
        persistCredentials: false

      # Trusted copy of the CI scripts: the first parent of the PR merge commit is the target branch tip, so nothing the pull
      # request changed is in it. Extracted into a clean directory (not over the working tree) so PR-added modules cannot
      # shadow anything. Fails closed when HEAD is not a merge commit.
      - bash: |
          set -euo pipefail
          git rev-parse --verify --quiet 'HEAD^2' > /dev/null || { echo "HEAD is not a pull request merge commit; refusing to trust the scripts." >&2; exit 1; }
          case "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" in refs/heads/dev|refs/heads/main|dev|main) ;; *) echo "Pull request target is not dev or main; refusing to trust the scripts." >&2; exit 1;; esac
          tb="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
          git merge-base --is-ancestor 'HEAD^1' "refs/remotes/origin/$tb" || git merge-base --is-ancestor "refs/remotes/origin/$tb" 'HEAD^1' || { echo "HEAD^1 is not on the $tb history; refusing to trust the scripts." >&2; exit 1; }
          mkdir -p "$(Agent.TempDirectory)/trusted"
          git archive 'HEAD^1' scripts/ci .ci | tar -x -C "$(Agent.TempDirectory)/trusted"
        displayName: Stage trusted CI scripts from the target branch

      - task: AzureCLI@2
        displayName: Load the read-only PR CI GitHub token from Key Vault
        inputs:
          azureSubscription: $(AZURE_PR_CI_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: python3 "$(Agent.TempDirectory)/trusted/scripts/ci/load_vault_secrets.py" --provider azure --consumer azure-pr-ci --vault "$AZURE_KEY_VAULT_NAME"
        env:
          AZURE_KEY_VAULT_NAME: $(AZURE_KEY_VAULT_NAME)

      # Guard: run only when GitHub says azure is the active provider (after any running switch finishes). Unset means the
      # documented default github. A real read failure fails the build (fail-safe: the required status stays unreported).
      - bash: python3 scripts/ci/android_ci.py guard --provider azure
        name: guard
        displayName: Guard - check active CI provider
        env:
          GH_PAT: $(GH_PAT)
          CI_REPOSITORY: $(Build.Repository.Name)

      - bash: bash scripts/ci/checkout-submodules.sh
        displayName: Checkout PR head and private submodules
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))
        env:
          GH_PAT: $(GH_PAT)
          PR_HEAD_SHA: $(System.PullRequest.SourceCommitId)

      - bash: python3 scripts/ci/load_repo_variables.py --pipeline pr --repository "$(Build.Repository.Name)"
        displayName: Load repository variables from GitHub
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))
        env:
          GH_PAT: $(GH_PAT)

      - task: JavaToolInstaller@0
        displayName: Set up JDK 17
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))
        inputs:
          versionSpec: $(JDK_VERSION)
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled

      - bash: python3 scripts/ci/android_ci.py pr-metadata --sha "$(System.PullRequest.SourceCommitId)"
        name: meta
        displayName: Set build metadata
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))

      - bash: bash scripts/ci/run-ci-tests.sh
        displayName: Pipeline parity check and CI script tests
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))

      - bash: python3 scripts/ci/android_ci.py install-swig
        displayName: Install swig
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))

      - bash: python3 scripts/ci/android_ci.py install-android-sdk
        displayName: Install Android SDK packages
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))

      - bash: python3 scripts/ci/android_ci.py gradle unit-tests
        displayName: Run Unit Tests (app)
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))
        env:
          PRIMARY_SERVERS_URL: $(repo.PRIMARY_SERVERS_URL)
          FALLBACK_SERVERS_URL: $(repo.FALLBACK_SERVERS_URL)

      - task: CopyFiles@2
        displayName: Collect unit test reports
        condition: failed()
        inputs:
          SourceFolder: src
          Contents: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/test-results/testDebugUnitTest/**
          TargetFolder: $(Build.ArtifactStagingDirectory)/unit-test-report

      - task: PublishPipelineArtifact@1
        displayName: Publish unit test reports (on failure)
        condition: failed()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/unit-test-report
          artifact: unit-test-report

      - bash: python3 scripts/ci/android_ci.py gradle debug-apks
        displayName: Build Debug APKs (mobile + tv)
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))
        env:
          PRIMARY_SERVERS_URL: $(repo.PRIMARY_SERVERS_URL)
          FALLBACK_SERVERS_URL: $(repo.FALLBACK_SERVERS_URL)

      - bash: python3 scripts/ci/android_ci.py gradle release-sanity
        displayName: Build Release APKs (unsigned sanity check)
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))
        env:
          PRIMARY_SERVERS_URL: $(repo.PRIMARY_SERVERS_URL)
          FALLBACK_SERVERS_URL: $(repo.FALLBACK_SERVERS_URL)

      - bash: python3 scripts/ci/android_ci.py rename-apks --sha "$(System.PullRequest.SourceCommitId)"
        displayName: Rename APKs with commit SHA
        condition: and(succeeded(), eq(variables['guard.active'], 'true'))

      - task: PublishPipelineArtifact@1
        displayName: Upload Debug APK (mobile)
        condition: and(always(), eq(variables['guard.active'], 'true'))
        inputs:
          targetPath: src/mobile/build/outputs/apk/debug
          artifact: apk-mobile-debug_$(meta.short_sha)

      - task: PublishPipelineArtifact@1
        displayName: Upload Debug APK (tv)
        condition: and(always(), eq(variables['guard.active'], 'true'))
        inputs:
          targetPath: src/tv/build/outputs/apk/debug
          artifact: apk-tv-debug_$(meta.short_sha)

  # Posts the CI Gate commit status only. Everything it runs comes from the target-branch copy (see the trust note at the
  # top); it never builds or executes pull-request code. Reports nothing when the build job never reached an active guard.
  - job: gate
    displayName: CI Gate
    dependsOn: build
    condition: and(always(), eq(dependencies.build.outputs['guard.active'], 'true'), ne(variables['System.PullRequest.SourceCommitId'], ''))
    variables:
      BUILD_RESULT: $[ dependencies.build.result ]
    steps:
      - checkout: self
        fetchDepth: 2
        fetchTags: false
        submodules: false
        persistCredentials: false

      - bash: |
          set -euo pipefail
          git rev-parse --verify --quiet 'HEAD^2' > /dev/null || { echo "HEAD is not a pull request merge commit; refusing to trust the scripts." >&2; exit 1; }
          case "${SYSTEM_PULLREQUEST_TARGETBRANCH:-}" in refs/heads/dev|refs/heads/main|dev|main) ;; *) echo "Pull request target is not dev or main; refusing to trust the scripts." >&2; exit 1;; esac
          mkdir -p "$(Agent.TempDirectory)/trusted"
          git archive 'HEAD^1' scripts/ci .ci | tar -x -C "$(Agent.TempDirectory)/trusted"
        displayName: Stage trusted CI scripts from the target branch

      - task: AzureCLI@2
        displayName: Load the statuses-only GitHub token from Key Vault
        inputs:
          azureSubscription: $(AZURE_PR_GATE_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: python3 "$(Agent.TempDirectory)/trusted/scripts/ci/load_vault_secrets.py" --provider azure --consumer azure-pr-gate --vault "$AZURE_KEY_VAULT_NAME"
        env:
          AZURE_KEY_VAULT_NAME: $(AZURE_KEY_VAULT_NAME)

      - bash: >-
          python3 "$(Agent.TempDirectory)/trusted/scripts/ci/android_ci.py" ci-gate --provider azure --job-result "$(BUILD_RESULT)"
          --sha "$(System.PullRequest.SourceCommitId)"
          --target-url "$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
        displayName: Report final CI Gate status
        env:
          GH_PAT: $(GH_PAT)
          CI_REPOSITORY: $(Build.Repository.Name)
